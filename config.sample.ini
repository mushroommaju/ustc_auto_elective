; 所有 DEMO/OLD/BACK 代码均为虚构占位符，不代表真实开课。
; 复制为 config.ini，填写自己当前批次的课堂代码，先运行 check-config 和 --dry-run。

[page]
; 首次无人值守自动登录必须填写本人当前批次的完整选课 URL。
; 手动 login 可留空并在官网进入具体选课页；保存后可以复用。不要填写他人的 URL。
course_select_url =

[auth]
; true：从本地配置读取账号密码，使用官方认证页自动登录。
; 仅编辑自己的 config.ini，切勿在示例文件填写真实凭据或上传个人配置。
auto_login = false
username =
password =

[helper]
; monitor 只读；auto 才允许选课。退课另需下面规则显式授权。
mode = monitor
; 默认 30 秒，最低 5 秒。请遵守学校要求；收到 429 时自动延长等待。
poll_interval_seconds = 30
; 20 仅为示例。必须按学校对本人/本批次的规定填写，不用于绕过服务端限制。
max_credits = 20
; 0 持续运行；其他正数为运行分钟数。
max_run_minutes = 0
; 仅 Windows；true 临时阻止自动空闲睡眠，允许熄屏和锁屏。
prevent_idle_sleep = false
; 默认空。仅在人工确认某已选课程无需排课时填写，逗号分隔；风险见 README。
unscheduled_selected_codes =

; 启用目标的出现顺序就是尝试优先级；每轮至多处理一个目标的完整事务。
[course:primary]
enabled = true
code = DEMO1001P.01

; 以下两班是替代选项，最多选其一。第一班已满/冲突时才考虑第二班。
; 示例前提：主目标已选、两门旧课已退。无需前提时删掉这两项。
[course:alternative_a]
enabled = true
code = DEMO2001P.01
group = optional_course
requires_selected = DEMO1001P.01
requires_absent = OLD1001P.01, BACK1001P.01

[course:alternative_b]
enabled = true
code = DEMO2001P.02
group = optional_course
requires_selected = DEMO1001P.01
requires_absent = OLD1001P.01, BACK1001P.01

; 危险操作，默认关闭。只有目标有名额且唯一冲突为此旧课时才退旧选新。
; 非原子交换，无法保证目标或旧课名额；读完 README 后才可显式启用。
[swap:primary]
enabled = false
target_course_code = DEMO1001P.01
conflict_drop_course_code = OLD1001P.01
acknowledgement = DROP_THEN_ADD

; 目标经官网课表确认已选后，才退掉指定课程。
; 包括启动时目标已经在已选课表中的情况，不限于本程序选上的课程。
[after-select:primary]
enabled = false
trigger_course_code = DEMO1001P.01
drop_course_code = BACK1001P.01
acknowledgement = DROP_AFTER_SUCCESS
